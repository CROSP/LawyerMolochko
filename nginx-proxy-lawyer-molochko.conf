# Nginx reverse proxy for lawyer-molochko.com.ua → Docker (crosphz).
# Container listens on 8092 (HTTP) and 8453 (HTTPS). This config proxies from host 80/443.
#
# Install on host (crosphz):
#   sudo cp nginx-proxy-lawyer-molochko.conf /etc/nginx/conf.d/lawyer-molochko.conf
#   # Edit if needed: SSL cert paths, proxy_pass port
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL: If using Let's Encrypt (certbot), run certbot for lawyer-molochko.com.ua
#   and uncomment the ssl_* lines and the listen 443 ssl server block.

server {
    listen 80;
    listen [::]:80;
    server_name lawyer-molochko.com.ua www.lawyer-molochko.com.ua;

    # Optional: redirect HTTP to HTTPS (uncomment when SSL is ready)
    # return 301 https://$server_name$request_uri;

    location / {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}


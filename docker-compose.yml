# Lawyermolochko (Адвокатське бюро) — remote Docker deployment.
# Same host as pfirs: ssh crosphz. Volume mapping: wp-content + wp-config on host.

services:
  wordpress:
    image: wordpress:latest
    container_name: lawyermolochko_wordpress
    restart: unless-stopped
    # Bind to 8092/8453 (pfirs uses 8082). Host Nginx/Caddy proxies lawyer-molochko.com.ua → 8092
    ports:
      - "8092:80"
      - "8453:443"
    volumes:
      # Map host wp-content into container (themes, plugins, uploads)
      - ./wp-content:/var/www/html/wp-content
      # Docker-specific wp-config (DB from env, URLs from .env)
      - ./wp-config.docker.php:/var/www/html/wp-config.php
      # Raise PHP upload limit (default 2M is too small for images)
      - ./config/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wordpress_password_change_me}
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_TABLE_PREFIX: wp_
      WORDPRESS_URL: ${WORDPRESS_URL:-https://lawyer-molochko.com.ua}
      WORDPRESS_SITEURL: ${WORDPRESS_SITEURL:-https://lawyer-molochko.com.ua}
    depends_on:
      - db
    networks:
      - lawyermolochko_network

  db:
    image: mariadb:10.11
    container_name: lawyermolochko_db
    restart: unless-stopped
    volumes:
      - ./mysql-data:/var/lib/mysql
      - ./dumps:/docker-entrypoint-initdb.d
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wordpress_password_change_me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password_change_me}
    networks:
      - lawyermolochko_network
    command: --max_allowed_packet=256M --innodb_buffer_pool_size=512M

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: lawyermolochko_phpmyadmin
    restart: unless-stopped
    # Bind to localhost only so DB admin is not exposed to the internet (use SSH tunnel: ssh -L 8083:127.0.0.1:8083 crosphz)
    ports:
      - "127.0.0.1:8083:80"
    environment:
      PMA_HOST: db
      PMA_USER: wordpress
      PMA_PASSWORD: ${MYSQL_PASSWORD:-wordpress_password_change_me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password_change_me}
    depends_on:
      - db
    networks:
      - lawyermolochko_network

networks:
  lawyermolochko_network:
    driver: bridge
